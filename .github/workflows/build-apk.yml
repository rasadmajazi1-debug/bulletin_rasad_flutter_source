name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Inspect repository
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | head -100

      - name: Extract uploaded ZIP
        run: |
          set -eu
          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP file found in repository."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project
          find project -name pubspec.yaml -print

      - name: Locate Flutter project
        run: |
          set -eu
          PUBSPEC="$(find project -name pubspec.yaml -type f | head -1)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::The ZIP does not contain pubspec.yaml."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter --version
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-rasad-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
